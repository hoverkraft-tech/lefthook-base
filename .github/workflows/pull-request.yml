name: Pull request - Continuous Integration

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  pull-request-labeler:
    if: github.event.pull_request.head.repo.full_name == github.repository
    name: Pull request labeler
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: release-drafter/release-drafter/autolabeler@978bb0b30c5ee8cdd332ced253758157150d43f0 # v7.10.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  ci:
    name: Continuous Integration
    uses: $/.github/workflows/__shared-ci.yml
    permissions:
      contents: read
      id-token: write
      issues: read
      packages: write
      pull-requests: read
    secrets: inherit
