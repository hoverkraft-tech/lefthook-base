name: Shared - Continuous Integration

on:
  workflow_call:

permissions: {}

jobs:
  lint:
    uses: hoverkraft-tech/ci-github-common/.github/workflows/linter.yml@a86c260e07b11a7a0ca3b7205bbdba9908230917 # 4.3.0
    permissions:
      actions: read
      contents: read
      issues: write
      packages: read
      pull-requests: write
      security-events: write
      statuses: write
    with:
      codeql-languages: ""
